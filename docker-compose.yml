services:
  postgres:
    image: postgres:16-alpine
    container_name: cursor-usage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cursor_usage
      POSTGRES_USER: cursor
      POSTGRES_PASSWORD: cursor_local_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cursor -d cursor_usage"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [cursor-monitoring]

  collector:
    build:
      context: ./collector
    container_name: cursor-usage-collector
    restart: unless-stopped
    environment:
      CURSOR_API_KEY: ${CURSOR_API_KEY}
      CURSOR_API_URL: https://api.cursor.com
      GROUP_NAMES: ${GROUP_NAMES}
      EXCLUDE_GROUP_NAMES: ${EXCLUDE_GROUP_NAMES:-}
      SHOW_UNASSIGNED_USERS: ${SHOW_UNASSIGNED_USERS:-true}
      UNASSIGNED_GROUP_NAME: ${UNASSIGNED_GROUP_NAME:-unassigned-users}
      COLLECTION_INTERVAL_SECONDS: ${COLLECTION_INTERVAL_SECONDS:-3600}
      DATABASE_URL: postgresql://cursor:cursor_local_password@postgres:5432/cursor_usage
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [cursor-monitoring]

  grafana:
    image: grafana/grafana:12.2.0
    container_name: cursor-usage-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [cursor-monitoring]

volumes:
  postgres_data:
  grafana_data:

networks:
  cursor-monitoring:
    driver: bridge
