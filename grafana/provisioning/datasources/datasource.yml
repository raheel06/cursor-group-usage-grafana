apiVersion: 1

datasources:
  - name: Cursor PostgreSQL
    uid: cursor-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: cursor
    secureJsonData:
      password: cursor_local_password
    jsonData:
      database: cursor_usage
      sslmode: disable
      postgresVersion: 16
      timescaledb: false
    isDefault: true
    editable: false
